      <stop offset="0" stop-color="#6ee7b7"/>
      <stop offset="0.52" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="bnLine" x1="884" y1="0" x2="956" y2="0" gradientUnits="userSpaceOnUse">
